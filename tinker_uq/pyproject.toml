[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinker-uq"
version = "0.2.0"
description = "Shared ICLR confidence training and AISTATS Mondrian experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.2"]

[project.optional-dependencies]
tinker = ["tinker", "torch", "transformers"]
plots = ["matplotlib>=3.7"]

[project.scripts]
tinker-uq = "tinker_uq.cli:main"

[tool.setuptools.packages.find]
include = ["tinker_uq*"]
